services:
  postgres:
    image: postgres:18
    container_name: students-db
    environment:
      POSTGRES_USER: warehouse_user
      POSTGRES_PASSWORD: warehouse_password
      POSTGRES_DB: students_db
    ports:
      - '5432:5432'
    volumes:
      - students_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U warehouse_user -d students_db']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: students-api
    environment:
      DATABASE_URL: postgresql://warehouse_user:warehouse_password@postgres:5432/students_db?schema=public
      PORT: 3000
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  students_pgdata:
